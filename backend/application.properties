server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/repusense_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent

google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
serpapi.api.key=${SERPAPI_API_KEY:}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.admin.bootstrap-email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}